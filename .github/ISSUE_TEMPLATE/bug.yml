name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Never paste a real credential. To show a missed or wrong detection, describe the format (prefix, length, character set) instead.
  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag, or the commit you use (`git rev-parse --short HEAD`).
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, `bash --version`, `grep --version`, `git --version`.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Include the exit status. Redact any credential-like text from the output.
    validations:
      required: true
