name: Feature request
description: Suggest an improvement, such as a new credential format to detect.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How could secret-scan solve it? For a new format, describe it and link the vendor's documentation; never paste a real key.
    validations:
      required: true
